name: Monthly data refresh

on:
  schedule:
    - cron: "17 6 2 * *"   # 06:17 UTC on the 2nd of each month
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance

      - name: Refresh data (retries for Yahoo rate limits)
        run: |
          ok=0
          for i in 1 2 3; do
            if python refresh_data.py; then ok=1; break; fi
            echo "attempt $i failed; retrying in 90s"
            sleep 90
          done
          [ "$ok" = 1 ]

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sanity gate
        run: node tests/sanity.js

      - name: Commit & push if changed
        run: |
          if git diff --quiet data.js; then
            echo "data.js unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Auto-refresh data through $(date -u -d 'last month' +%Y-%m)"
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data refresh failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The scheduled data refresh failed — the site keeps serving the previous month's data.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nUsual suspects: Yahoo rate-limiting the runner IP (re-run the workflow), a yfinance breaking change, or a data-quality failure caught by tests/sanity.js (do NOT bypass the gate — investigate the series it names).`,
            })
